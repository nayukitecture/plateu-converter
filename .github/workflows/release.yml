name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        working-directory: packaging
        run: pyinstaller plateu-converter.spec
      - name: Rename artifact
        shell: bash
        run: mv packaging/dist/plateu-converter.exe packaging/dist/plateu-converter-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/plateu-converter-windows.exe

  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        working-directory: packaging
        run: pyinstaller plateu-converter.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel
          path: packaging/dist/plateu-converter

  build-mac-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        working-directory: packaging
        run: pyinstaller plateu-converter.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm
          path: packaging/dist/plateu-converter

  package-mac:
    needs: [build-mac-intel, build-mac-arm]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-intel
          path: mac-intel
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm
          path: mac-arm
      - name: Create universal binary and .app bundle
        run: |
          lipo -create -output plateu-converter mac-intel/plateu-converter mac-arm/plateu-converter
          APP="plateu-converter.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp plateu-converter "$APP/Contents/Resources/plateu-converter"
          chmod +x "$APP/Contents/Resources/plateu-converter"
          cp packaging/mac-launcher.sh "$APP/Contents/MacOS/plateu-converter"
          chmod +x "$APP/Contents/MacOS/plateu-converter"
          cp packaging/mac-info.plist "$APP/Contents/Info.plist"
          zip -r plateu-converter-macos.zip plateu-converter.app
      - uses: softprops/action-gh-release@v2
        with:
          files: plateu-converter-macos.zip
