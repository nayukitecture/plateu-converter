name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: plateu-converter-windows.exe
            python_arch: 'x64'
          - os: macos-14
            asset: plateu-converter-macos-intel.zip
            python_arch: 'x64'
          - os: macos-14
            asset: plateu-converter-macos-arm.zip
            python_arch: 'arm64'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        working-directory: packaging
        run: pyinstaller plateu-converter.spec

      - name: Rename Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mv packaging/dist/plateu-converter.exe packaging/dist/plateu-converter-windows.exe

      - name: Build macOS .app bundle
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP="packaging/dist/plateu-converter.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp packaging/dist/plateu-converter "$APP/Contents/Resources/plateu-converter"
          chmod +x "$APP/Contents/Resources/plateu-converter"
          cp packaging/mac-launcher.sh "$APP/Contents/MacOS/plateu-converter"
          chmod +x "$APP/Contents/MacOS/plateu-converter"
          cp packaging/mac-info.plist "$APP/Contents/Info.plist"
          cd packaging/dist
          zip -r "${{ matrix.asset }}" plateu-converter.app

      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/${{ matrix.asset }}
